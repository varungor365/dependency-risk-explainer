[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dependency-risk-explainer"
version = "0.1.0"
description = "Explain and prioritize Node.js dependency risks for small projects"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Varun Ruhella" }]
keywords = ["dependency-security", "supply-chain-security", "npm", "sbom", "devsecops"]
classifiers = ["Development Status :: 3 - Alpha", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Security"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
dep-risk = "dependency_risk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
